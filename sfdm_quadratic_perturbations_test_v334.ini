# End-to-end perturbation test for one quadratic SFDM species in CLASS v3.3.4

# Baseline cosmology
h = 0.67810
T_cmb = 2.7255
omega_b = 0.02238280
N_ur = 3.044

# Replace the baseline CDM density with quadratic SFDM
omega_cdm = 0.0
Omega_sfdm_1 = 0.261205693250012
attractor_ic_sfdm_1 = yes
sfdm_parameters_1 = -22.0, 0.0, 1.e-2
sfdm_tuning_index_1 = 2

# Flat model with no additional dark-energy fields
Omega_k = 0.0
Omega_fld = 0.0
Omega_scf = 0.0

# Thermodynamics
YHe = BBN
recombination = HyRec
z_reio = 7.6711

# Primordial scalar perturbations
A_s = 2.100549e-9
n_s = 0.9660499
modes = s
ic = ad
gauge = synchronous

# Exercise P(k), density/velocity transfers and fixed-k diagnostics
output = mPk,dTk,vTk
format = class
z_pk = 0.0
P_k_max_h/Mpc = 5.0
k_output_values = 0.001, 0.01, 0.1, 1.0

# Explicitly exercise synchronous-to-Newtonian diagnostic conversion
get_perturbations_in_current_gauge = no

root = output/sfdm_perturbations_test
overwrite_root = yes
write_parameters = yes
write_warnings = yes

input_verbose = 1
background_verbose = 1
perturbations_verbose = 1
fourier_verbose = 1
output_verbose = 1
