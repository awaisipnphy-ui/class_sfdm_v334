# CMB smoke test for one quadratic SFDM species in CLASS v3.3.4

# Baseline cosmology
h = 0.67810
T_cmb = 2.7255
omega_b = 0.02238280
N_ur = 3.044

# Replace CDM with one non-interacting quadratic SFDM species
omega_cdm = 0.0
Omega_sfdm_1 = 0.261205693250012
attractor_ic_sfdm_1 = yes
sfdm_parameters_1 = -22.0, 0.0, 1.e-2
sfdm_tuning_index_1 = 2

# Flat cosmology
Omega_k = 0.0
Omega_fld = 0.0
Omega_scf = 0.0

# Thermodynamics
YHe = BBN
recombination = HyRec
z_reio = 7.6711

# Primordial scalar perturbations
A_s = 2.100549e-9
n_s = 0.9660499
modes = s
ic = ad
gauge = synchronous

# Temperature, polarization, lensing and matter power spectrum
output = tCl,pCl,lCl,mPk
lensing = yes
l_max_scalars = 2500
z_pk = 0.0
P_k_max_h/Mpc = 5.0

root = output/sfdm_cmb_test
overwrite_root = yes
write_parameters = yes
write_warnings = yes

input_verbose = 1
background_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
fourier_verbose = 1
harmonic_verbose = 1
lensing_verbose = 1
output_verbose = 1
