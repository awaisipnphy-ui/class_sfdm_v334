# Background-only validation of the first quadratic SFDM field in CLASS v3.3.4
# This deliberately requests no CMB spectra, transfer functions, or matter P(k),
# because the SFDM perturbation equations have not yet been ported.

# Baseline expansion parameters
h = 0.67810
T_cmb = 2.7255
omega_b = 0.02238280

# Replace the baseline CDM density omega_cdm=0.1201075 by the same density in SFDM:
# Omega_sfdm_1 = omega_cdm/h^2 = 0.1201075/(0.67810)^2
omega_cdm = 0.0
Omega_sfdm_1 = 0.261205693250012

# First validated model: V(phi) = (1/2) m^2 phi^2 with m = 10^(-22) eV
attractor_ic_sfdm_1 = yes
sfdm_parameters_1 = -22.0, 0.0, 1.e-2
sfdm_tuning_index_1 = 2

# Flat background; CLASS infers the cosmological-constant density
Omega_k = 0.0
Omega_fld = 0.0
Omega_scf = 0.0

# Match the verified LCDM baseline settings relevant to the background/thermodynamics
N_ur = 3.044
YHe = BBN
recombination = HyRec
z_reio = 7.6711

# Fixed test output names
write_background = yes
write_parameters = yes
write_warnings = yes
root = output/sfdm_background_test_
overwrite_root = yes

# Diagnostic messages
input_verbose = 1
background_verbose = 2
thermodynamics_verbose = 1
output_verbose = 1
